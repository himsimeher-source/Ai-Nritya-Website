<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up — Nritya AI</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <img class="image-gradient" src="download (10).jpg" alt="gradient" onerror="this.style.display='none'">
    <div class="layer-blur"></div>

    <div class="container">
        <header>
            <a href="index1.html" class="logo-wrap">
                <div class="logo-badge">🪷</div>
                <h1 class="logo">AI <span>Nritya</span></h1>
            </a>
            <nav>
                <a href="index1.html">Home</a>
                <a href="style.html">Style</a>
                <a href="about.html">About</a>
                <a href="information.html">Information</a>
                <a href="quiz.html">Quiz</a>
                <a href="leaderboard.html">Leaderboard</a>
            </nav>
            <div class="header-actions">
                <a href="Login.html" class="btn">Log in</a>
            </div>
        </header>
    </div>

    <div class="auth-wrapper">
        <div class="auth-box">
            <a href="index1.html" class="auth-logo">🪷 AI Nritya</a>

            <h2>Create Account</h2>
            <p class="auth-subtext">Start learning dance with AI posture correction</p>

            <form id="signup-form" onsubmit="handleSignupSubmit(event)">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" required>
                </div>

                <button type="submit" class="auth-submit">Create Account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="Login.html">Log in here</a></p>
        </div>
    </div>

    <script src="dance-data.js"></script>
    <script src="ai-service.js"></script>
    <script src="pose-engine.js"></script>
    <script src="app.js"></script>
    <script>
        function handleSignupSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const mobile = document.getElementById('mobile').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            const res = window.nrityaApp.signup({ name, mobile, email, password, confirmPassword });
            if (res.success) {
                window.nrityaApp.showToast(`Account created! Welcome, ${res.user.name}!`);
                setTimeout(() => {
                    window.location.href = 'style.html';
                }, 800);
            } else {
                alert(res.message);
            }
        }
    </script>
</body>
</html>
